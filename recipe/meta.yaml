{% set name = "pycnite" %}
{% set version = "2024.7.31" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pycnite-{{ version }}.tar.gz
  sha256: 5125f1c95aef4a23b9bec3b32fae76873dcd46324fa68e39c10fa852ecdea340

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - pycnite
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/google/pycnite
  summary: Python bytecode utilities
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/google/pycnite
  doc_url: https://github.com/google/pycnite/

extra:
  recipe-maintainers:
    - ngam
